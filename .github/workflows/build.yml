name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试（43 个 pytest）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install PyMuPDF opencv-python-headless Pillow numpy pytest
      - name: 运行测试
        run: pytest tests -q

  build:
    name: 打包 Windows exe
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install PyMuPDF opencv-python-headless Pillow numpy PySide6 pyinstaller
      - name: PyInstaller 打包
        run: pyinstaller --noconfirm --onefile --windowed --name "合同盖章工具" run_app.py
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: contract-sealer-windows-exe
          path: dist/合同盖章工具.exe
          retention-days: 30
      - name: 发布 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/合同盖章工具.exe
          generate_release_notes: true
